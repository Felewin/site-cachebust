name: site-cachebust
description: Publish every file of a static site again in a version folder that changes with its content, set year-long cache lifetimes for those folders, and publish the site to Cloudflare Pages.

inputs:
  project-name:
    description: The Cloudflare Pages project to publish to.
    required: true
  cloudflare-api-token:
    description: A Cloudflare API token that can publish to Cloudflare Pages, and write items in the bucket when one is used.
    required: true
  cloudflare-account-id:
    description: The Cloudflare account that holds the project.
    required: true
  site-folder:
    description: The folder that holds the site, relative to the repository root.
    required: false
    default: .
  exclude:
    description: Paths in the site folder that are not part of the site, one per line. Names that start with "." are always left out.
    required: false
    default: ""
  bucket:
    description: An R2 bucket for files too large for Cloudflare Pages, which accepts files up to 25 MiB. The site's own worker serves them.
    required: false
    default: ""
  bucket-files:
    description: The files that go to the bucket instead of to Pages, one per line. Each is uploaded only when its content differs from the bucket's copy.
    required: false
    default: ""
  r2-steward-url:
    description: The address of the R2 steward the account's apps ask before every save to R2. Needed when a bucket file is uploaded.
    required: false
    default: ""
  r2-steward-secret:
    description: The R2 steward's secret. Needed when a bucket file is uploaded.
    required: false
    default: ""
  branch:
    description: The Cloudflare Pages branch to publish.
    required: false
    default: main

runs:
  using: composite
  steps:
    # - The last publish's cachebust.js, kept in the repository's Actions cache, for a site whose live address answers only behind a sign-in.
    - name: Restore the last published versions
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/site-cachebust-last
        key: site-cachebust-${{ inputs.project-name }}-${{ github.run_id }}
        restore-keys: site-cachebust-${{ inputs.project-name }}-

    # - The live site's own cachebust.js names each file's hash and version there, so an unchanged file keeps its version, and browsers keep their copy across the deploy.
    # - The project's own address comes from Cloudflare, since a project whose name was taken lives at a pages.dev address of its own; the fresh query reaches past any copy the edge holds.
    # - A live address that answers with no tables, such as one behind a sign-in, gives way to the last publish's copy; with neither, every file takes this deploy's version.
    - name: Read the live versions
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PROJECT_NAME: ${{ inputs.project-name }}
        LIVE_RUNTIME_FILE: ${{ runner.temp }}/live-cachebust.js
        LAST_RUNTIME_FILE: ${{ runner.temp }}/site-cachebust-last/cachebust.js
      run: |
        address=$(curl --silent --fail --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" | jq --raw-output '.result.subdomain // empty') || address=""
        address=${address:-$PROJECT_NAME.pages.dev}
        if ! curl --silent --fail --max-time 30 --output "$LIVE_RUNTIME_FILE" "https://$address/cachebust.js?fresh=$(date +%s)" || ! grep --quiet '^var FILE_VERSIONS = ' "$LIVE_RUNTIME_FILE"; then
          rm -f "$LIVE_RUNTIME_FILE"
          if [ -f "$LAST_RUNTIME_FILE" ]; then
            cp "$LAST_RUNTIME_FILE" "$LIVE_RUNTIME_FILE"
            echo "https://$address answers with no versions, so the versions come from the last publish's copy."
          else
            echo "https://$address answers with no versions, and no publish's copy is kept, so every file takes this deploy's version."
          fi
        fi

    # - The stamped copy is written inside the workspace, so a site's own wrangler.toml can name it as its output folder.
    - name: Stamp the site
      shell: bash
      env:
        SITE_FOLDER: ${{ inputs.site-folder }}
        STAGE_FOLDER: ${{ github.workspace }}/.site-cachebust-published
        LIVE_RUNTIME_FILE: ${{ runner.temp }}/live-cachebust.js
        EXCLUDE: ${{ inputs.exclude }}
        BUCKET_FILES: ${{ inputs.bucket-files }}
        COMMIT: ${{ github.sha }}
      run: node "${{ github.action_path }}/stamp.cjs"

    # - R2 speaks the S3 protocol, where the token's id is the access key and the SHA-256 hash of the token is the secret key.
    # - The bucket remembers each file's MD5 hash as its ETag. A file whose hash already matches is skipped.
    # - Before any upload, the account's R2 steward weighs every file that would be uploaded, against its line at 80% of R2's free monthly allowance. One no holds the whole publish, nothing is uploaded nor published, and the steward pings its owner.
    # - The two CHECKSUM settings keep the AWS command line tool from sending newer checksum headers that R2 refuses.
    - name: Fill the bucket
      if: inputs.bucket != ''
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PROJECT_NAME: ${{ inputs.project-name }}
        SITE_FOLDER: ${{ inputs.site-folder }}
        BUCKET: ${{ inputs.bucket }}
        BUCKET_FILES: ${{ inputs.bucket-files }}
        R2_STEWARD_URL: ${{ inputs.r2-steward-url }}
        R2_STEWARD_SECRET: ${{ inputs.r2-steward-secret }}
        AWS_DEFAULT_REGION: auto
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      run: |
        set -o pipefail

        AWS_ACCESS_KEY_ID=$(curl --silent --show-error --fail --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq --raw-output '.result.id')
        AWS_SECRET_ACCESS_KEY=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut --delimiter=' ' --fields=1)
        echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
        export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
        bucket_address="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"

        # - First, the files whose content differs from the bucket's copy.
        uploads=()
        while IFS= read -r bucket_file; do
          bucket_file=$(echo "$bucket_file" | xargs)
          [ -z "$bucket_file" ] && continue
          local_path="$SITE_FOLDER/$bucket_file"
          repository_hash=$(md5sum "$local_path" | cut --delimiter=' ' --fields=1)
          # An object the bucket does not hold yet answers with an error, which leaves its hash empty.
          bucket_hash=$(aws s3api head-object --endpoint-url "$bucket_address" --bucket "$BUCKET" --key "$bucket_file" --query ETag --output text 2>/dev/null | tr --delete '"') || bucket_hash=""
          if [ "$repository_hash" = "$bucket_hash" ]; then
            echo "The bucket already holds $bucket_file ($repository_hash)."
          else
            echo "The bucket's copy of $bucket_file (${bucket_hash:-none}) differs from $repository_hash."
            uploads+=("$bucket_file")
          fi
        done <<< "$BUCKET_FILES"

        # - Gives back yeses whose uploads never happened.
        release_reservations() {
          for reservation in "$@"; do
            curl --silent --output /dev/null --max-time 30 --request POST --header "Authorization: Bearer $R2_STEWARD_SECRET" --header 'Content-Type: application/json' --data "$(jq --null-input --arg id "$reservation" '{reservationId: $id}')" "$R2_STEWARD_URL/release" || true
          done
        }

        # - Then the steward weighs every upload, before any is made.
        reservations=()
        if [ ${#uploads[@]} -gt 0 ] && { [ -z "$R2_STEWARD_URL" ] || [ -z "$R2_STEWARD_SECRET" ]; }; then
          echo "::error::Uploading to the bucket asks the R2 steward first, so pass r2-steward-url and r2-steward-secret. Nothing was uploaded nor published."
          exit 1
        fi
        for bucket_file in "${uploads[@]}"; do
          ask=$(jq --null-input --arg app "The $PROJECT_NAME site" --arg what "the bucket file $bucket_file" --argjson bytes "$(stat --format=%s "$SITE_FOLDER/$bucket_file")" --arg fallback "the $PROJECT_NAME publish stops, holding back this file, and the site keeps its last published version" '{app: $app, what: $what, bytes: $bytes, fallback: $fallback}')
          answer=$(curl --silent --show-error --max-time 30 --request POST --header "Authorization: Bearer $R2_STEWARD_SECRET" --header 'Content-Type: application/json' --data "$ask" "$R2_STEWARD_URL/ask") || answer=''
          if [ "$(printf '%s' "$answer" | jq --raw-output '.isAllowed == true' 2>/dev/null)" != "true" ]; then
            release_reservations "${reservations[@]}"
            reason=$(printf '%s' "$answer" | jq --raw-output '.reason // .error // empty' 2>/dev/null)
            echo "::error::The R2 steward held $bucket_file (${reason:-no answer}), so nothing was uploaded nor published. At its line, 80% of R2's free monthly allowance, it pings its owner."
            exit 1
          fi
          reservations+=("$(printf '%s' "$answer" | jq --raw-output '.reservationId')")
        done

        # - Last, the uploads themselves. A failed upload gives back the yeses of the files after it.
        for index in "${!uploads[@]}"; do
          bucket_file=${uploads[$index]}
          echo "Uploading $bucket_file."
          if ! aws s3api put-object --endpoint-url "$bucket_address" --bucket "$BUCKET" --key "$bucket_file" --body "$SITE_FOLDER/$bucket_file" > /dev/null; then
            release_reservations "${reservations[@]:$((index + 1))}"
            exit 1
          fi
        done

    - name: Publish to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        command: pages deploy .site-cachebust-published --project-name=${{ inputs.project-name }} --branch=${{ inputs.branch }}

    # - Once the publish has landed, its cachebust.js is kept for the next deploy, which reads it when the live address answers only behind a sign-in.
    - name: Keep the published versions
      shell: bash
      run: |
        mkdir -p "${{ runner.temp }}/site-cachebust-last"
        cp "${{ github.workspace }}/.site-cachebust-published/cachebust.js" "${{ runner.temp }}/site-cachebust-last/cachebust.js"

    - name: Save the published versions
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/site-cachebust-last
        key: site-cachebust-${{ inputs.project-name }}-${{ github.run_id }}